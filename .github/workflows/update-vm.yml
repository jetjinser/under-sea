name: update-vm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Manifest package name
        required: true
        type: string

permissions:
  contents: read

jobs:
  vm:
    runs-on: [self-hosted, linux, x64, guix, kvm]
    steps:
      - uses: actions/checkout@v4
      - name: Run VM test
        run: guix shell make -- make update-vm PACKAGE="${{ inputs.package }}"
