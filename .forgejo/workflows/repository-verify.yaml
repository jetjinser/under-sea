name: Repository / Validate and build

on:
  push:
    branches:
      - master
      - 'automation/update-*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Guix packages
    runs-on: host/guix
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh

      - name: Audit update inventory and test update framework
        run: guix shell -m manifest.scm -- make verify-ci-update

      - name: Build and smoke-test standalone package matrix
        run: guix shell -m manifest.scm -- make verify-ci-standalone

      - name: Lint package definitions and verify packaging metadata
        run: guix shell -m manifest.scm -- make verify-ci-packaging

      - name: Smoke-test package matrix
        run: guix shell -m manifest.scm -- make verify-ci-phase7

      - name: Check service containers
        run: guix shell -m manifest.scm -- make verify-ci-system
