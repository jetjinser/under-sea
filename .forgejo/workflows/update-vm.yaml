name: update-vm

on:
  workflow_dispatch:
    inputs:
      package:
        description: Manifest package name
        required: true
        type: string

permissions:
  contents: read

jobs:
  vm:
    runs-on: host/guix
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh
      - name: Run VM test
        run: guix shell make -- make update-vm PACKAGE="${{ inputs.package }}"
