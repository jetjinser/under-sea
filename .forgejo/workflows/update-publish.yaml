name: update-publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Manifest package name
        required: true
        type: string
      version:
        description: Target version (optional)
        required: false
        type: string
      dry_run:
        description: Only print the publish plan; do not sign or push
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: host/guix
    environment: update-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh
      - name: Import signing key
        if: ${{ !inputs.dry_run }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.UPDATE_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || {
            echo 'UPDATE_GPG_PRIVATE_KEY secret is required for signed commits' >&2
            exit 1
          }
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          git config user.name "under-sea update bot"
          git config user.email "update-bot@users.noreply.github.com"
      - name: Prepare and verify
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          guix shell python-minimal -- python3 scripts/update/run.py prepare \
            --package "$PACKAGE" \
            ${VERSION:+--version "$VERSION"} \
            --apply --verify --workdir "$RUNNER_TEMP/update"
      - name: Dry-run publish plan
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          guix shell python-minimal -- python3 scripts/update/publish.py             --package "${{ inputs.package }}" --version "${VERSION:-latest}"

      - name: Commit and open PR
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="update/${PACKAGE}-$(date +%Y%m%d%H%M%S)"
          git switch --create "$branch"
          git add -A
          git commit -S -m "${PACKAGE}: update to ${VERSION:-latest}"
          git push origin "$branch"
          UPDATE_BRANCH="$branch" \
          UPDATE_PR_TITLE="${PACKAGE}: update to ${VERSION:-latest}" \
            guix shell python-minimal -- python3 scripts/update/create_pr.py
