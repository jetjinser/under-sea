name: Packages / Build Helium and retain output

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helium-retained-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Helium and retain latest success
    runs-on: host/guix
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh

      - name: Build Helium and update persistent GC root
        shell: bash
        run: |
          set -euo pipefail
          root_dir="$HOME/.local/share/guix/gcroots/under-sea"
          root="$root_dir/helium"
          next_root="$root_dir/.helium-${{ github.run_id }}-${{ github.run_attempt }}"
          log="$root_dir/helium-build.log"
          mkdir -p "$root_dir"
          echo "Building Helium; successful output will be retained at $root"
          echo "Full build log: $log"
          rm -f "$next_root"
          trap 'rm -f "$next_root"' EXIT
          # Use parallelism to fit the host runner's configured 7200s hard limit.
          if guix time-machine -C channels.scm -- build \
            --root="$next_root" \
            --cores=8 \
            --max-silent-time=7200 \
            --keep-failed \
            -L "$GITHUB_WORKSPACE/modules" \
            -e '(@ (under-sea packages helium) helium)' >"$log" 2>&1; then
            echo "Helium build succeeded. Last 40 log lines:"
            tail -n 40 "$log"
            mv -Tf "$next_root" "$root"
            echo "Retained Helium output: $root -> $(readlink -f "$root")"
          else
            status=$?
            echo "Helium build failed with exit status $status. Last 120 log lines:"
            tail -n 120 "$log" >&2
            exit "$status"
          fi
