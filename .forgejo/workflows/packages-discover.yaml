name: Packages / Discover upstream changes

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Read-only upstream scan and report
    runs-on: host/guix
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh
      - name: Audit package inventory
        run: guix shell python-minimal -- python3 scripts/update/audit.py
      - name: Validate update manifest
        run: guix shell python-minimal -- python3 scripts/update/run.py validate --manifest planning/update-manifest.json
      - name: Detect upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: |
          guix shell python-minimal -- python3 scripts/update/run.py detect --all --json | tee update-report.json
          guix shell python-minimal -- python3 scripts/update/report.py --json > coverage-report.json
      - name: Detect Helium components
        run: guix shell python-minimal -- python3 scripts/update/helium.py --json | tee helium-report.json
      - name: Check qwenimage ncnn submodule
        env:
          GITHUB_TOKEN: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
        run: guix shell python-minimal -- python3 scripts/update/qwenimage.py --json | tee qwenimage-report.json
      - name: Summarize
        run: |
          guix shell python-minimal -- python3 - <<'PY'
          import json
          rows = json.load(open('update-report.json'))
          for row in rows:
              print(f"{row['package']}: {row['current']} -> {row['latest'] or '?'} ({row['status']})")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: update-report
          path: |
            update-report.json
            coverage-report.json
            helium-report.json
            qwenimage-report.json
