name: CI

on:
  push:
    branches:
      - master
      - 'automation/update-*'
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify Guix packages
    runs-on: host/guix
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure isolated trust for pinned channels
        run: scripts/ci/setup-guix-trust.sh

      - name: Run CI verification suite
        run: guix shell -m manifest.scm -- make verify-ci
